services:
  db:
    image: postgres:17
    container_name: retail-retention-db

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "${DB_PORT}:5432"

    volumes:
      - retail_retention_pgdata:/var/lib/postgresql/data

volumes:
  retail_retention_pgdata: